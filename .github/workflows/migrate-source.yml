name: Migrate EmulationStation source into repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulationstation-webos-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch pinned RetroPie baseline
        env:
          RETROPIE_ES_REF: 1071b8358b316ebda837933150db949bda90495e
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/retropie-emulationstation"
          git clone https://github.com/RetroPie/EmulationStation.git "$upstream"
          git -C "$upstream" checkout --detach "$RETROPIE_ES_REF"
          git -C "$upstream" submodule update --init --recursive
          test "$(git -C "$upstream" rev-parse HEAD)" = "$RETROPIE_ES_REF"
          echo "UPSTREAM_DIR=$upstream" >> "$GITHUB_ENV"
          echo "RETROPIE_ES_REF=$RETROPIE_ES_REF" >> "$GITHUB_ENV"
          echo "PUGIXML_REF=$(git -C "$upstream/external/pugixml" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply existing webOS port once
        run: |
          set -euo pipefail
          python3 scripts/patch-retropie-webos.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-remote.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-ui.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-no-dummy.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-quit.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-browser.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-scraper.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-theme-anchor.py "$UPSTREAM_DIR" prepare
          python3 scripts/patch-retropie-webos-theme-manager.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-theme-runtime.py "$UPSTREAM_DIR"
          python3 scripts/patch-retropie-webos-theme-anchor.py "$UPSTREAM_DIR" restore

      - name: Vendor patched source tree
        run: |
          set -euo pipefail
          tar -C "$UPSTREAM_DIR" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./README.md' \
            --exclude='./LICENSE.md' \
            --exclude='./.gitmodules' \
            --exclude='*/.git' \
            -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -
          rm -f .gitmodules
          find external -name .git -exec rm -rf {} + 2>/dev/null || true

      - name: Convert helpers to direct source builds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('scripts/build-webos.sh')
          text = build.read_text()
          text = text.replace(
              'source_dir="${RETROPIE_ES_SOURCE_DIR:-$repo_root/upstream}"',
              'source_dir="${EMULATIONSTATION_SOURCE_DIR:-$repo_root}"',
          )
          text = text.replace(
              '[[ -f "$source_dir/CMakeLists.txt" ]] || { echo "RetroPie EmulationStation source not found at $source_dir" >&2; exit 1; }',
              '[[ -f "$source_dir/CMakeLists.txt" ]] || { echo "EmulationStation source not found at $source_dir" >&2; exit 1; }',
          )
          text = '\n'.join(
              line for line in text.splitlines()
              if 'scripts/patch-retropie-webos' not in line
          ) + '\n'
          build.write_text(text)

          package = Path('scripts/package-webos.sh')
          text = package.read_text().replace(
              'source_dir="${RETROPIE_ES_SOURCE_DIR:-$repo_root/upstream}"',
              'source_dir="${EMULATIONSTATION_SOURCE_DIR:-$repo_root}"',
          )
          package.write_text(text)
          PY
          rm -f scripts/patch-retropie-webos*.py

      - name: Write project identity and provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          baseline = os.environ['RETROPIE_ES_REF']
          pugixml = os.environ['PUGIXML_REF']

          def clean(text: str) -> str:
              return text.replace('\n          ', '\n').lstrip()

          Path('README.md').write_text(clean('''# EmulationStation WebOS

          A TV-focused EmulationStation frontend for rooted LG webOS TVs, based on the RetroPie fork of EmulationStation.

          This repository contains the EmulationStation application source directly. CI no longer downloads and patches `RetroPie/EmulationStation` for every build; webOS is maintained as a first-class target in this codebase.

          - Target: LG webOS, ARMv7 / Cortex-A9 / softfp / NEON
          - Graphics/input: SDL-webOS + OpenGL ES 2
          - Package ID: `com.rf1705.emulationstation`
          - Upstream baseline: `RetroPie/EmulationStation` commit `1071b8358b316ebda837933150db949bda90495e`
          - License: MIT

          ## webOS integration

          The port is intentionally TV-native rather than a Raspberry Pi environment transplanted onto a TV.

          - LG Magic Remote navigation and OK input
          - Back is claimed from webOS and mapped to EmulationStation back/escape behavior
          - Home is claimed as the EmulationStation menu key while the webOS Home ribbon is suppressed inside the app
          - root-level Back asks before cleanly exiting EmulationStation
          - host shutdown/reboot actions are removed from the quit menu
          - graphical Games & Systems configuration for webOS paths
          - no artificial `webos` console/system entry in the carousel
          - a zero-system installation opens configuration instead of failing with the desktop EmulationStation error
          - built-in webOS-oriented UI text/localization and theme management
          - webOS file browser and scraper adaptations

          ## Source layout

          The EmulationStation application sources live directly in this repository:

          ```text
          es-app/
          es-core/
          external/
          resources/
          CMake/
          CMakeLists.txt
          ```

          `external/pugixml` is vendored as normal source files from the revision used by the imported upstream baseline. The previous `patch-retropie-webos-*.py` layer is gone.

          See [`UPSTREAM.md`](UPSTREAM.md) for the exact baseline and how to compare future RetroPie changes manually.

          ## Build

          GitHub Actions builds this source tree directly using the `openlgtv/buildroot-nc4` webOS Buildroot SDK, `webosbrew/SDL-webOS`, pinned vcpkg dependencies and `ares-package` for IPK generation.

          Pushes to `main` build an artifact similar to:

          ```text
          com.rf1705.emulationstation_1.0.0-webos0.1.0_arm.ipk
          ```

          The webOS build deliberately omits Raspberry Pi-specific Broadcom/OMX code and the libVLC runtime. Packaged ELF files are stripped and only the required shared-library dependency closure is included.

          ## Runtime log

          The native launcher redirects stdout and stderr to:

          ```text
          /tmp/com.rf1705.emulationstation.log
          ```

          On a rooted TV:

          ```sh
          cat /tmp/com.rf1705.emulationstation.log
          ```

          ## Project status

          This is an active webOS fork and still a work in progress. The source history and architecture originate from EmulationStation and the RetroPie fork, while webOS-specific behavior is maintained here directly.

          ## Support

          If this project is useful to you, you can support development on [Buy Me a Coffee](https://buymeacoffee.com/rf1705).

          GitHub funding metadata is available in [`.github/FUNDING.yml`](.github/FUNDING.yml).
          '''))

          Path('LICENSE.md').write_text(clean('''Copyright (c) 2014 Alec Lofquist
          Copyright (c) 2026 Ronald Fiering

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in
          all copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN
          THE SOFTWARE.
          '''))

          Path('UPSTREAM.md').write_text(clean(f'''# Upstream baseline

          EmulationStation WebOS is based on the RetroPie fork of EmulationStation.

          On 2026-08-09 the project switched from applying webOS patch scripts during CI to maintaining the complete application source directly in this repository.

          - Upstream repository: `RetroPie/EmulationStation`
          - Imported commit: `{baseline}`
          - Vendored pugixml revision: `{pugixml}`
          - Upstream license: MIT

          The imported source was patched with the complete webOS patch set used by the previous CI build before being committed here. This preserves the behavior of the patch-based build while making future webOS work normal source changes.

          ## Comparing future upstream changes

          Upstream is no longer fetched during normal builds. To inspect later RetroPie changes in a local clone:

          ```sh
          git remote add retropie https://github.com/RetroPie/EmulationStation.git
          git fetch retropie
          ```

          Compare or cherry-pick individual upstream changes intentionally rather than automatically rebasing the webOS project.

          `external/pugixml` is vendored rather than kept as a Git submodule; its own license files remain in that directory.
          '''))

          credits = Path('CREDITS.md')
          credits.write_text(credits.read_text().rstrip() + clean('''

          ## EmulationStation WebOS

          - Ronald Fiering (RF1705) - LG webOS port and maintenance
          - RetroPie EmulationStation contributors - upstream fork and ongoing EmulationStation development
          '''))
          PY

      - name: Validate standalone source tree
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -d es-app
          test -d es-core
          test -d resources
          test -d external/pugixml
          test -f external/pugixml/LICENSE.md || test -f external/pugixml/LICENSE
          test ! -e .gitmodules
          test ! -d upstream
          if find scripts -maxdepth 1 -name 'patch-retropie-webos*.py' -print -quit | grep -q .; then
            echo 'Patch scripts still present after migration.' >&2
            exit 1
          fi
          if grep -R -n -E 'RETROPIE_ES_SOURCE_DIR|repo_root/upstream' scripts; then
            echo 'Old upstream-at-build-time references still present in build helpers.' >&2
            exit 1
          fi
          grep -q '^buy_me_a_coffee: rf1705$' .github/FUNDING.yml
          grep -q 'SDL_WEBOS_ACCESS_POLICY_KEYS_HOME' packaging/launch-emulationstation.c
          grep -q 'SDL_WEBOS_ACCESS_POLICY_RIBBON' packaging/launch-emulationstation.c
          grep -q 'SDL_SCANCODE_WEBOS_HOME' es-core/src/InputManager.cpp
          bash -n scripts/*.sh
          git diff --check

      - name: Commit standalone source tree
        run: |
          set -euo pipefail
          git config user.name 'Ronald Fiering'
          git config user.email 'rfiering@googlemail.com'
          git add -A -- ':!.github/workflows'
          git status --short
          git commit -m 'Vendor EmulationStation source for webOS'
          git push origin HEAD:main
