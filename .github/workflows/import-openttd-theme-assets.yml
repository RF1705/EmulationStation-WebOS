name: Import OpenTTD theme assets

on:
  push:
    paths:
      - .github/workflows/import-openttd-theme-assets.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Import official OpenTTD artwork
        shell: bash
        run: |
          set -euo pipefail
          revision="7a4d71998fa265c08221ef24019c5da00bddfc39"
          base="https://raw.githubusercontent.com/OpenTTD/website/$revision"
          art="resources/theme-overlays/simple-dark/openttd/art"
          tmp="$RUNNER_TEMP/openttd-theme"
          mkdir -p "$art" "$tmp"

          curl --fail --location --retry 3 "$base/static/img/layout/openttd-64.gif" -o "$tmp/openttd-64.gif"
          curl --fail --location --retry 3 "$base/static/img/layout/openttd-logo.png" -o "$tmp/openttd-logo.png"
          curl --fail --location --retry 3 "$base/_screenshots/1.0-20081018_tom_storey.png" -o "$tmp/openttd-screenshot.png"

          convert -size 500x136 xc:none \
            \( "$tmp/openttd-64.gif" -resize 128x128 \) -geometry +0+4 -composite \
            \( "$tmp/openttd-logo.png" -resize 302x58 \) -geometry +156+70 -composite \
            -strip "$art/openttd.png"

          convert "$tmp/openttd-screenshot.png" \
            -resize '1920x1080^' -gravity center -extent 1920x1080 \
            -fill 'rgba(0,0,0,0.18)' -draw 'rectangle 0,0 1920,1080' \
            -strip -quality 88 "$art/openttd_background.jpg"

          cat > resources/theme-overlays/simple-dark/openttd/SOURCES.md <<EOF
          # OpenTTD theme artwork

          Source repository: OpenTTD/website
          Pinned revision: $revision

          Official logo composition follows the website element \`#openttd-logo\`:
          - \`static/img/layout/openttd-64.gif\`
          - \`static/img/layout/openttd-logo.png\`

          Background source:
          - \`_screenshots/1.0-20081018_tom_storey.png\`
          - Caption on the official site: "Using trucks to transport cargo makes for a completely different challenge."

          The background is centre-cropped to 1920x1080 and lightly darkened for TV UI readability.
          EOF

          cat > resources/theme-overlays/simple-dark/openttd/theme.xml <<'EOF'
          <theme>
              <formatVersion>3</formatVersion>
              <include>./../simple-dark.xml</include>

              <view name="system">
                  <image name="background" extra="true">
                      <path>./art/openttd_background.jpg</path>
                  </image>
                  <image name="logo">
                      <path>./art/openttd.png</path>
                  </image>
                  <helpsystem name="help">
                      <textColor>ffffff66</textColor>
                      <iconColor>ffffff66</iconColor>
                  </helpsystem>
              </view>

              <view name="basic, detailed">
                  <text name="system_name_1" extra="true">
                      <text>OpenTTD</text>
                      <forceUppercase>1</forceUppercase>
                      <size>0.45 0.16</size>
                      <pos>0.527 0</pos>
                      <color>0098a6</color>
                      <fontPath>./../art/Roboto-Light.ttf</fontPath>
                      <fontSize>0.055</fontSize>
                      <alignment>right</alignment>
                  </text>
                  <image name="logo">
                      <path>./art/openttd.png</path>
                      <pos>0.025 0.079</pos>
                      <maxSize>0.47 0.1</maxSize>
                      <origin>0 0.5</origin>
                  </image>
              </view>

              <view name="basic">
                  <textlist name="gamelist">
                      <pos>0.025 0.22</pos>
                      <size>0.950 0.68</size>
                      <alignment>center</alignment>
                      <horizontalMargin>0.01</horizontalMargin>
                  </textlist>
              </view>

              <view name="detailed">
                  <image name="md_image"><pos>0.025 0.22</pos><maxSize>0.135 0.301</maxSize><origin>0 0</origin></image>
                  <text name="md_lbl_rating"><pos>0.187 0.21</pos></text>
                  <text name="md_lbl_releasedate"><pos>0.187 0.25</pos></text>
                  <text name="md_lbl_developer"><pos>0.187 0.29</pos><size>0.133 0.04</size></text>
                  <text name="md_lbl_publisher"><pos>0.187 0.33</pos><size>0.133 0.04</size></text>
                  <text name="md_lbl_genre"><pos>0.187 0.37</pos></text>
                  <text name="md_lbl_players"><pos>0.187 0.41</pos></text>
                  <text name="md_lbl_lastplayed"><pos>0.187 0.45</pos></text>
                  <text name="md_lbl_playcount"><pos>0.187 0.49</pos></text>
                  <text name="md_playcount"><pos>0.320 0.49</pos></text>
                  <datetime name="md_lastplayed"><pos>0.320 0.45</pos></datetime>
                  <text name="md_players"><pos>0.320 0.41</pos></text>
                  <text name="md_genre"><pos>0.320 0.37</pos><size>0.24 0.04</size></text>
                  <text name="md_publisher"><pos>0.320 0.33</pos><size>0.24 0.04</size></text>
                  <text name="md_developer"><pos>0.320 0.29</pos><size>0.24 0.04</size></text>
                  <datetime name="md_releasedate"><pos>0.320 0.25</pos></datetime>
                  <rating name="md_rating">
                      <pos>0.320 0.216</pos>
                      <size>0.028 0.028</size>
                      <filledPath>./../art/star_filled_spacing.svg</filledPath>
                      <unfilledPath>./../art/star_hollow_3_spacing.svg</unfilledPath>
                  </rating>
                  <text name="md_description"><size>0.52 0.3</size><pos>0.025 0.577</pos></text>
                  <textlist name="gamelist">
                      <pos>0.615 0.22</pos>
                      <size>0.359 0.68</size>
                      <alignment>left</alignment>
                      <horizontalMargin>0.01</horizontalMargin>
                  </textlist>
              </view>
          </theme>
          EOF

          cat > scripts/add-simple-dark-overlay.py <<'PY'
          #!/usr/bin/env python3
          """Inject repository theme overlays into a packaged Simple Dark ZIP."""

          from __future__ import annotations

          import os
          import shutil
          import sys
          import tempfile
          import zipfile
          from pathlib import Path


          def add_overlay(archive_path: Path, overlay_path: Path) -> None:
              if not archive_path.is_file():
                  raise SystemExit(f"Simple Dark archive not found: {archive_path}")
              if not overlay_path.is_dir():
                  raise SystemExit(f"Simple Dark overlay not found: {overlay_path}")

              overlay_files = {
                  path.relative_to(overlay_path).as_posix(): path
                  for path in overlay_path.rglob("*")
                  if path.is_file()
              }
              if not overlay_files:
                  raise SystemExit(f"Simple Dark overlay is empty: {overlay_path}")

              fd, temporary_name = tempfile.mkstemp(
                  prefix="simple-dark-overlay-", suffix=".zip", dir=archive_path.parent
              )
              os.close(fd)
              temporary_path = Path(temporary_name)

              try:
                  with zipfile.ZipFile(archive_path, "r") as source:
                      members = source.infolist()
                      roots = [member.filename.split("/", 1)[0] for member in members if "/" in member.filename]
                      if not roots:
                          raise SystemExit("Simple Dark archive has no codeload root directory")
                      prefix = roots[0] + "/"
                      replaced = {prefix + relative for relative in overlay_files}

                      with zipfile.ZipFile(
                          temporary_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
                      ) as destination:
                          for member in members:
                              if member.filename in replaced:
                                  continue
                              destination.writestr(member, b"" if member.is_dir() else source.read(member.filename))

                          for relative, source_file in sorted(overlay_files.items()):
                              destination.writestr(prefix + relative, source_file.read_bytes())

                  with zipfile.ZipFile(temporary_path, "r") as result:
                      missing = sorted(replaced - set(result.namelist()))
                      if missing:
                          raise SystemExit("Simple Dark overlay is incomplete: " + ", ".join(missing))

                  os.replace(temporary_path, archive_path)

                  packaged_overlay_root = archive_path.parents[1] / "theme-overlays"
                  source_overlay_root = overlay_path.parent
                  if (
                      packaged_overlay_root.is_dir()
                      and packaged_overlay_root.resolve() != source_overlay_root.resolve()
                  ):
                      shutil.rmtree(packaged_overlay_root)

                  print(f"Added {len(overlay_files)} Simple Dark overlay files from {overlay_path}")
              finally:
                  if temporary_path.exists():
                      temporary_path.unlink()


          def main() -> int:
              if len(sys.argv) != 3:
                  print(f"usage: {sys.argv[0]} SIMPLE_DARK_ZIP OVERLAY_DIR", file=sys.stderr)
                  return 2
              add_overlay(Path(sys.argv[1]).resolve(), Path(sys.argv[2]).resolve())
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x scripts/add-simple-dark-overlay.py

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/theme-overlays/simple-dark/openttd scripts/add-simple-dark-overlay.py
          git diff --cached --stat
          git commit -m "Add official OpenTTD Simple Dark artwork"
          git push origin HEAD:main
