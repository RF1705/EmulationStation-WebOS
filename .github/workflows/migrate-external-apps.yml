name: Migrate external webOS app integration

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/migrate-external-apps.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add optional external webOS app systems
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Persisted toggle, disabled by default.
          replace('es-core/src/Settings.cpp',
              '\tmBoolMap["WebOSSystemPSX"] = false;\n',
              '\tmBoolMap["WebOSSystemPSX"] = false;\n\tmBoolMap["WebOSSystemOpenTTD"] = false;\n')

          # Generic external-app support in the system model.
          replace('es-app/src/SystemData.h',
              '\tstd::string mLaunchCommand;\n\tstd::vector<PlatformIds::PlatformId> mPlatformIds;\n',
              '\tstd::string mLaunchCommand;\n#ifdef WEBOS\n\tstd::string mWebOSAppId;\n#endif\n\tstd::vector<PlatformIds::PlatformId> mPlatformIds;\n')
          replace('es-app/src/SystemData.h',
              '\tinline bool hasPlatformId(PlatformIds::PlatformId id) { if (!mEnvData) return false; return std::find(mEnvData->mPlatformIds.cbegin(), mEnvData->mPlatformIds.cend(), id) != mEnvData->mPlatformIds.cend(); }\n',
              '\tinline bool hasPlatformId(PlatformIds::PlatformId id) { if (!mEnvData) return false; return std::find(mEnvData->mPlatformIds.cbegin(), mEnvData->mPlatformIds.cend(), id) != mEnvData->mPlatformIds.cend(); }\n#ifdef WEBOS\n\tinline bool isWebOSExternalApp() const { return mEnvData && !mEnvData->mWebOSAppId.empty(); }\n\tinline const std::string& getWebOSAppId() const { return mEnvData->mWebOSAppId; }\n#endif\n')

          replace('es-app/src/SystemData.cpp',
              '\t\tmRootFolder = new FileData(FOLDER, mEnvData->mStartPath, mEnvData, this);\n\t\tmRootFolder->metadata.set("name", mFullName);\n\n\t\tif(!Settings::getInstance()->getBool("ParseGamelistOnly"))\n\t\t\tpopulateFolder(mRootFolder);\n\n\t\tif(!Settings::getInstance()->getBool("IgnoreGamelist"))\n\t\t\tparseGamelist(this);\n\n\t\tmRootFolder->sort(FileSorts::SortTypes.at(0));\n\n\t\tindexAllGameFilters(mRootFolder);\n',
              '\t\tmRootFolder = new FileData(FOLDER, mEnvData->mStartPath, mEnvData, this);\n\t\tmRootFolder->metadata.set("name", mFullName);\n\n#ifdef WEBOS\n\t\tif(!isWebOSExternalApp())\n\t\t{\n#endif\n\t\t\tif(!Settings::getInstance()->getBool("ParseGamelistOnly"))\n\t\t\t\tpopulateFolder(mRootFolder);\n\n\t\t\tif(!Settings::getInstance()->getBool("IgnoreGamelist"))\n\t\t\t\tparseGamelist(this);\n\n\t\t\tmRootFolder->sort(FileSorts::SortTypes.at(0));\n\t\t\tindexAllGameFilters(mRootFolder);\n#ifdef WEBOS\n\t\t}\n#endif\n')
          replace('es-app/src/SystemData.cpp',
              '\tmIsGameSystem = (mName != "retropie");\n',
              '#ifdef WEBOS\n\tmIsGameSystem = (mName != "retropie" && !isWebOSExternalApp());\n#else\n\tmIsGameSystem = (mName != "retropie");\n#endif\n')
          replace('es-app/src/SystemData.cpp',
              '\tstd::string name, fullname, path, cmd, themeFolder, defaultCore;\n',
              '\tstd::string name, fullname, path, cmd, themeFolder, defaultCore;\n#ifdef WEBOS\n\tstd::string webosAppId;\n#endif\n')
          replace('es-app/src/SystemData.cpp',
              '\tdefaultCore = system.child("defaultCore").text().get();\n\n\tstd::vector<std::string> list = readList(system.child("extension").text().get());\n',
              '\tdefaultCore = system.child("defaultCore").text().get();\n#ifdef WEBOS\n\twebosAppId = system.child("webosAppId").text().get();\n#endif\n\n\tstd::vector<std::string> list = readList(system.child("extension").text().get());\n')
          replace('es-app/src/SystemData.cpp',
              '\t//validate\n\tif (name.empty() || path.empty() || extensions.empty() || cmd.empty())\n\t{\n\t\tLOG(LogError) << "System \\"" << name << "\\" is missing name, path, extension, or command!";\n\t\treturn nullptr;\n\t}\n',
              '\t// validate normal ROM systems and webOS external-app systems separately\n#ifdef WEBOS\n\tconst bool externalApp = !webosAppId.empty();\n\tif(externalApp)\n\t{\n\t\tif(name.empty())\n\t\t{\n\t\t\tLOG(LogError) << "External webOS app system is missing a name!";\n\t\t\treturn nullptr;\n\t\t}\n\t\tif(path.empty())\n\t\t\tpath = Utils::FileSystem::getHomePath();\n\t\tif(extensions.empty())\n\t\t\textensions.push_back(".webosapp");\n\t\tif(cmd.empty())\n\t\t\tcmd = "/bin/true";\n\t}\n\telse\n#endif\n\tif (name.empty() || path.empty() || extensions.empty() || cmd.empty())\n\t{\n\t\tLOG(LogError) << "System \\"" << name << "\\" is missing name, path, extension, or command!";\n\t\treturn nullptr;\n\t}\n')
          replace('es-app/src/SystemData.cpp',
              '\tenvData->mLaunchCommand = cmd;\n\tenvData->mPlatformIds = platformIds;\n',
              '\tenvData->mLaunchCommand = cmd;\n#ifdef WEBOS\n\tenvData->mWebOSAppId = webosAppId;\n#endif\n\tenvData->mPlatformIds = platformIds;\n')
          replace('es-app/src/SystemData.cpp',
              '\tif (newSys->getRootFolder()->getChildren().size() == 0)\n',
              '#ifdef WEBOS\n\tif (!newSys->isWebOSExternalApp() && newSys->getRootFolder()->getChildren().size() == 0)\n#else\n\tif (newSys->getRootFolder()->getChildren().size() == 0)\n#endif\n')
          replace('es-app/src/SystemData.cpp',
              'bool SystemData::isVisible()\n{\n   return (getDisplayedGameCount() > 0 ||\n',
              'bool SystemData::isVisible()\n{\n#ifdef WEBOS\n   if(isWebOSExternalApp())\n       return true;\n#endif\n   return (getDisplayedGameCount() > 0 ||\n')
          replace('es-app/src/SystemData.cpp',
              '\tif(Settings::getInstance()->getBool("IgnoreGamelist") || mIsCollectionSystem)\n',
              '#ifdef WEBOS\n\tif(Settings::getInstance()->getBool("IgnoreGamelist") || mIsCollectionSystem || isWebOSExternalApp())\n#else\n\tif(Settings::getInstance()->getBool("IgnoreGamelist") || mIsCollectionSystem)\n#endif\n')

          # OpenTTD is the first optional external-app preset. More apps can be added here later.
          replace('es-app/src/guis/GuiMenu.cpp',
              'static const WebOSSystemPreset sWebOSSystemPresets[] = {\n',
              'struct WebOSExternalAppPreset\n{\n\tconst char* enabledKey;\n\tconst char* name;\n\tconst char* fullName;\n\tconst char* appId;\n\tconst char* theme;\n};\n\nstatic const WebOSExternalAppPreset sWebOSExternalAppPresets[] = {\n\t{"WebOSSystemOpenTTD", "openttd", "OpenTTD", "com.leondrolio.x.openttd", "openttd"}\n};\n\nstatic const WebOSSystemPreset sWebOSSystemPresets[] = {\n')
          replace('es-app/src/guis/GuiMenu.cpp',
              '\tconst std::string configPath = SystemData::getConfigPath(true);\n',
              '\tfor(const auto& preset : sWebOSExternalAppPresets)\n\t{\n\t\tif(!settings->getBool(preset.enabledKey))\n\t\t\tcontinue;\n\n\t\tpugi::xml_node system = list.append_child("system");\n\t\tsystem.append_child("name").text().set(preset.name);\n\t\tsystem.append_child("fullname").text().set(preset.fullName);\n\t\tsystem.append_child("webosAppId").text().set(preset.appId);\n\t\tsystem.append_child("theme").text().set(preset.theme);\n\t}\n\n\tconst std::string configPath = SystemData::getConfigPath(true);\n')
          replace('es-app/src/guis/GuiMenu.cpp',
              '\tfor(const auto& preset : sWebOSSystemPresets)\n\t{\n\t\tauto enabled = std::make_shared<SwitchComponent>(mWindow);\n',
              '\tfor(const auto& preset : sWebOSSystemPresets)\n\t{\n\t\tauto enabled = std::make_shared<SwitchComponent>(mWindow);\n')
          marker = '\t}\n\n\ts->addSaveFunc([this] {\n\t\tif(!saveWebOSSystemsConfig())\n'
          external_ui = '\t}\n\n\tfor(const auto& preset : sWebOSExternalAppPresets)\n\t{\n\t\tauto enabled = std::make_shared<SwitchComponent>(mWindow);\n\t\tenabled->setState(settings->getBool(preset.enabledKey));\n\t\ts->addWithLabel(std::string(preset.fullName) + " (webOS)", enabled);\n\n\t\tconst std::string enabledKey = preset.enabledKey;\n\t\ts->addSaveFunc([enabled, enabledKey] {\n\t\t\tSettings::getInstance()->setBool(enabledKey, enabled->getState());\n\t\t});\n\t}\n\n\ts->addSaveFunc([this] {\n\t\tif(!saveWebOSSystemsConfig())\n'
          replace('es-app/src/guis/GuiMenu.cpp', marker, external_ui)

          # Direct launch from the system carousel.
          replace('es-app/src/views/SystemView.cpp',
              '#include "WebOSLocalization.h"\n',
              '#include "WebOSLocalization.h"\n#ifdef WEBOS\n#include <cctype>\n#endif\n')
          replace('es-app/src/views/SystemView.cpp',
              '// buffer values for scrolling velocity (left, stopped, right)\n',
              '#ifdef WEBOS\nstatic bool launchWebOSApplication(const std::string& appId)\n{\n\tif(appId.empty())\n\t\treturn false;\n\tfor(char ch : appId)\n\t\tif(!(std::isalnum(static_cast<unsigned char>(ch)) || ch == \'.\' || ch == \'-\' || ch == \'_\'))\n\t\t\treturn false;\n\n\tconst std::string command = "luna-send -n 1 -f luna://com.webos.applicationManager/launch \'{\\\"id\\\":\\\"" + appId + "\\\"}\' >/dev/null 2>&1";\n\treturn runSystemCommand(command) == 0;\n}\n#endif\n\n// buffer values for scrolling velocity (left, stopped, right)\n')
          replace('es-app/src/views/SystemView.cpp',
              '\t\tif(config->isMappedTo("a", input))\n\t\t{\n\t\t\tstopScrolling();\n\t\t\tViewController::get()->goToGameList(getSelected());\n',
              '\t\tif(config->isMappedTo("a", input))\n\t\t{\n\t\t\tstopScrolling();\n#ifdef WEBOS\n\t\t\tif(getSelected()->isWebOSExternalApp())\n\t\t\t{\n\t\t\t\tif(!launchWebOSApplication(getSelected()->getWebOSAppId()))\n\t\t\t\t\tmWindow->pushGui(new GuiMsgBox(mWindow, webosTr("apps.launch_failed", "Could not launch the webOS application."), webosTr("common.ok", "OK")));\n\t\t\t\treturn true;\n\t\t\t}\n#endif\n\t\t\tViewController::get()->goToGameList(getSelected());\n')
          replace('es-app/src/views/SystemView.cpp',
              '\t\tif (!getSelected()->isGameSystem())\n\t\t\tss << "CONFIGURATION";\n',
              '#ifdef WEBOS\n\t\tif (getSelected()->isWebOSExternalApp())\n\t\t\tss << webosTr("system.webos_app", "WEBOS APP");\n\t\telse\n#endif\n\t\tif (!getSelected()->isGameSystem())\n\t\t\tss << "CONFIGURATION";\n')

          # English keys are the fallback for all languages; German gets native strings now.
          import json
          for lang, values in {
              'en': {
                  'apps.launch_failed': 'Could not launch the webOS application.',
                  'system.webos_app': 'WEBOS APP',
              },
              'de': {
                  'apps.launch_failed': 'Die webOS-App konnte nicht gestartet werden.',
                  'system.webos_app': 'WEBOS-APP',
              },
          }.items():
              p = Path(f'resources/i18n/{lang}.json')
              data = json.loads(p.read_text())
              data.update(values)
              p.write_text(json.dumps(dict(sorted(data.items())), ensure_ascii=False, indent=2) + '\n')
          PY

          git diff --check
          git status --short
          git config user.name "RF1705"
          git config user.email "rfiering@googlemail.com"
          git add es-core/src/Settings.cpp es-app/src/SystemData.h es-app/src/SystemData.cpp es-app/src/guis/GuiMenu.cpp es-app/src/views/SystemView.cpp resources/i18n/en.json resources/i18n/de.json
          git commit -m "Add optional native webOS app systems"
          git push origin HEAD:main
