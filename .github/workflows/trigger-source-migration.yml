name: Retry source migration on current main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-source-migration.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch migration workflow on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run migrate-source.yml --ref main --repo "$GITHUB_REPOSITORY"
